<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            background-color:azure;

        }
        .main{
            background-color: #FFFEF7;
            border: 5px solid black;
            width: 30vw;
            height: 80vh;
            margin:20px auto;

        }
        .main img{
            margin: 5px;
            width: 385px;
        }
        .two{
            margin: 5px;

        }
        .two span{
            border: 2px solid blue;
            background-color: aqua;
            border-radius:5px; 
            padding: 2px 5px;
        }
        .two h1{
            font-size: 25px;
            margin: 10px 0px;
        }
        .two button{
            border: 2px solid blue;
            background-color: aqua;
            border-radius:8px; 
            padding: 4px 8px;
            font-size:15px ;
            margin-left: 80%;
            margin-top: 10px;
        }
        .two p{
            font-size:medium ;
            color: rgba(59, 59, 116, 0.872);
        }
    </style>
</head>
<body>
    <div class="main">
        <div>
            <img src="minecraft.jpg" alt="Minecraft">
        </div>
        <div class="two">
            <span>Craft</span>
            <span>Build</span>
            <h1>Welcome to Mincraft World!</h1>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Iste, doloribus? Necessitatibus aliquam illo, cumque fugiat ratione, consequuntur fugit ea eum iure, quos architecto inventore molestiae alias sint provident non commodi!</p>
            <button>Play</button>
        </div>
    </div>

</body>
</html>
