<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
    <style>
        .box{
            background-color: pink;
            border: 2px solid black;
            padding: 30px;
            box-shadow:  10px 10px 10px rgb(198, 80, 80);
        }
        .ait p{
         /* text-shadow:  10px 10px 2px #d54c4c; */
         outline: 2px solid black;
         outline-offset: 10px;
         border: 2px solid black;
         border-radius: 10px;

        }
    </style>
</head>
<body>
    <div class="box">
        Hello World!
    </div>
    <div class="ait">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus, magnam.</p>
    </div>
    
</body>
</html>
