<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicolor Website</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        :root{
            --bg:rgb(164, 31, 31);
            --tc:white;
        }
        body{
            background-color: rgb(136, 227, 227);
        }
        nav{
            background-color: var(--bg);
            
            
            
        }
        nav ul li a{
            text-decoration: none;
            color: var(--tc);
        }
        nav ul li{
            display:inline;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
