<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Fast Food Delivery
    </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f7ff;
            color: #102a43;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #0066ff;
            color: white;
            padding: 20px 8%;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }

        header div {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Section */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
        }

        main div {
            max-width: 800px;
            background-color: white;
            padding: 50px;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.12);
            border: 1px solid #d6e8ff;
        }

        h1 {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 25px;
            color: #0052cc;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
            color: #486581;
        }

        /* Footer */
        footer {
            background-color: #003d99;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 16px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            main {
                padding: 40px 15px;
            }

            main div {
                padding: 30px 20px;
            }

            h1 {
                font-size: 38px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

        <div>
            <div>
                <a href="https://www.zomato.com/"><img
                        src="https://upload.wikimedia.org/wikipedia/commons/7/75/Zomato_logo.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
                        alt="Zomato_LOGO" width="50"></a>
            </div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="contact.html" target="_blank">Contact</a>
            <a href="Chap3.html"target="_blank">Chapter3</a>

        </div>
    </header>

    <main>
        <div>
            <h1>India’s #1
                food delivery app</h1>
            <p>For over a decade, we’ve enabled our customers to discover new tastes, delivered right to their doorstep
            </p>
        </div>

    </main>

    <footer>
        Made By SUraj 2026
    </footer>
</body>

</html>
